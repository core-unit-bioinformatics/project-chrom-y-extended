[cubi.metadata]
pid = "https://github.com/core-unit-bioinformatics/template-metadata-files"
version = "1.6.1"

[cubi.project]
pid = "https://git.hhu.de/cubi/chrom-y-extended"
name = "chrom-y-extended"
start_date = 2025-01-17
end_data = 2099-12-31
version = "optional"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pylint.format]
max-line-length = "88"

[tool.pylint.messages_control]
disable = [ "logging-fstring-interpolation", "useless-return", "missing-module-docstring",]
